name: p_comic
description: "A new Flutter project."
publish_to: 'none'
version: 1.2.0+17

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  http: ^1.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path: ^1.9.0
  flutter_html: ^3.0.0-beta.2
  timeago: ^3.7.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  google_fonts: ^6.2.1
  lottie: ^3.1.2
  cloud_firestore: ^5.6.12
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  firebase_storage: ^12.4.10
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
  fonts:
    - family: Cabin
      fonts:
        - asset: assets/fonts/Cabin-Regular.ttf
        - asset: assets/fonts/Cabin-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cabin-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/p_comic.png"
  remove_alpha_ios: true
