name: Build and Release Flutter App

on:
  push:
    tags:
      - 'v*' # Trigger workflow khi push bất kỳ tag nào bắt đầu bằng 'v' (ví dụ: v1.0.0)

permissions:
  contents: write # Cấp quyền ghi để tạo Release và upload file APK

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout mã nguồn từ repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Thiết lập môi trường Java (bắt buộc cho Android build)
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Thiết lập Flutter (Mặc định dùng phiên bản Stable mới nhất)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 4. Tải các dependencies của Flutter
      - name: Install dependencies
        run: flutter pub get

      # 4.5. Tự động tạo tệp cấu hình API tạm thời để biên dịch
      - name: Create API Config File
        run: |
          mkdir -p lib/config
          echo "class ApiConfig { static const String geminiApiKey = '${{ secrets.GEMINI_API_KEY }}'; }" > lib/config/api_config.dart

      # 5. Chạy phân tích mã nguồn (Tùy chọn - Không chặn build nếu có cảnh báo linter)
      - name: Analyze project
        run: flutter analyze || true

      # 5.5. Giải mã Android Keystore từ GitHub Secrets
      - name: Decode Android Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.jks

      # 6. Build file APK cho Android (Release mode)
      - name: Build APK
        run: |
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/P_Comic.apk
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 7. Tự động tạo Release trên GitHub và đính kèm file APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/app/outputs/flutter-apk/P_Comic.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## Phiên bản mới ${{ github.ref_name }} đã sẵn sàng!
            
            ### Có gì mới:
            *Xem chi tiết commit để biết các thay đổi.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
